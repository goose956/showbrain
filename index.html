<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowBrain — Episode Intelligence</title>
    <meta name="description" content="ShowBrain — the intelligence layer for your podcast. Transcribe, analyse, and repurpose your episodes automatically." />
    <script>
      // Apply theme before first paint — prevents flash of wrong theme
      (function() {
        var t = localStorage.getItem('showbrain_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
